services:
  app:
    image: node:24
    container_name: gestion-stages-app
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3003:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Connexion DB depuis le conteneur via le nom du service "postgres"
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-gestion_stages}?schema=public
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
    volumes:
      # Workspace local monté pour le dev (hot reload, édition locale)
      - ./:/app
      # Évite que le bind-mount écrase node_modules dans le conteneur
      - app_node_modules:/app/node_modules
      # Conserve les fichiers d'uploads/stockage applicatif
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -lc
      "npm install
      && npx prisma generate
      && npx prisma migrate deploy
      && npm run dev -- --hostname 0.0.0.0 --port 3000"

  postgres:
    image: postgres:15-alpine
    container_name: gestion-stages-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-gestion_stages}
    # Port lié à 127.0.0.1 uniquement (non exposé sur l'internet) pour accès local
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  storage_data:
  app_node_modules:

